services:

  ############################
  # REDIS
  ############################
  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ############################
  # RABBITMQ
  ############################
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s

  ############################
  # POSTGRES — AUTH
  ############################
  postgres_auth:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  ############################
  # POSTGRES — USER
  ############################
  postgres_user:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  ############################
  # POSTGRES — APPOINTMENT
  ############################
  postgres_appointment:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_pass
    volumes:
      - appointment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment_user -d appointment_db"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  ############################
  # MONGO — MEDICAL
  ############################
  mongo_medical:
    image: mongo:6
    restart: always
    volumes:
      - mongo_medical_data:/data/db

  ############################
  # AUTH SERVICE
  ############################
  auth-service:
    build: ./auth_service
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./auth_service:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres_auth
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: mentora-jwt-secret-2025-change-this
      USER_SERVICE_URL: http://user-service:8001
      INTERNAL_SERVICE_TOKEN: dev-internal
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_started

  ############################
  # USER SERVICE
  ############################
  user-service:
    build: ./user_service
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8001
      "
    volumes:
      - ./user_service:/app
    env_file:
      - ./user_service/.env
    ports:
      - "8001:8001"
    environment:
      INTERNAL_SERVICE_TOKEN: dev-internal
      DB_HOST: postgres_user
      DB_NAME: user_db
      DB_USER: user_user
      DB_PASSWORD: user_pass
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: mentora-jwt-secret-2025-change-this
    depends_on:
      postgres_user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  ############################
  # APPOINTMENT SERVICE
  ############################
  appointment_service:
    build: ./appointment_service
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8002
      "
    volumes:
      - ./appointment_service:/app
    env_file:
      - ./appointment_service/.env
    ports:
      - "8002:8002"
    environment:
      POSTGRES_HOST: postgres_appointment
      POSTGRES_DB: appointment_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_pass
      POSTGRES_PORT: 5432
      JWT_SECRET: mentora-jwt-secret-2025-change-this
      AUTH_SERVICE_BASE_URL: http://auth-service:8000/api
      USER_SERVICE_BASE_URL: http://user-service:8001/api
    depends_on:
      postgres_appointment:
        condition: service_healthy

  ############################
  # MEDICAL SERVICE (FASTAPI)
  ############################
  medical_service:
    build: ./medical_service
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    volumes:
      - ./medical_service:/app
    ports:
      - "8003:8003"
    environment:
      MONGO_URI: mongodb://mongo_medical:27017
      MONGO_DB: mentora_medical
      JWT_SECRET: mentora-jwt-secret-2025-change-this
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # Service-to-Service Auth
      INTERNAL_SERVICE_TOKEN: dev-internal
      USER_SERVICE_URL: http://user-service:8001
      # RAG Configuration
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      LLM_MODEL: ${LLM_MODEL:-google/flan-t5-base}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}

    depends_on:
      mongo_medical:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ############################
  # CELERY WORKER — USER
  ############################
  celery_user_worker:
    build: ./user_service
    restart: always
    command: celery -A user_service_project worker --loglevel=info
    volumes:
      - ./user_service:/app
    environment:
      DB_HOST: postgres_user
      DB_NAME: user_db
      DB_USER: user_user
      DB_PASSWORD: user_pass
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: mentora-jwt-secret-2025-change-this
      INTERNAL_SERVICE_TOKEN: dev-internal
    depends_on:
      postgres_user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  ############################
  # CELERY BEAT — USER
  ############################
  celery_user_beat:
    build: ./user_service
    restart: always
    command: celery -A user_service_project beat --loglevel=info
    volumes:
      - ./user_service:/app
    environment:
      DB_HOST: postgres_user
      DB_NAME: user_db
      DB_USER: user_user
      DB_PASSWORD: user_pass
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: mentora-jwt-secret-2025-change-this
      INTERNAL_SERVICE_TOKEN: dev-internal
    depends_on:
      postgres_user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  ############################
  # CONSUMER — APPOINTMENT SERVICE
  ############################
  appointment_consumer:
    build: ./appointment_service
    restart: always
    working_dir: /app
    command: python consume_doctor_events.py
    volumes:
      - ./appointment_service:/app
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  ############################
  # CONSUMER — MEDICAL SERVICE
  ############################
  medical_consumer:
    build: ./medical_service
    restart: always
    working_dir: /app
    command: python -m app.messaging.consumer_runner
    volumes:
      - ./medical_service:/app
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MONGO_URI: mongodb://mongo_medical:27017
      MONGO_DB: mentora_medical
      JWT_SECRET: mentora-jwt-secret-2025-change-this
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo_medical:
        condition: service_started

############################
# VOLUMES
############################
volumes:
  auth_db_data:
  user_db_data:
  appointment_db_data:
  mongo_medical_data:
  rabbitmq_data:
